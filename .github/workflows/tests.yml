name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Unit and API tests
        run: python -m pytest -q
      - name: Gold-standard validation (fails on any failed scenario or score drift)
        run: python testing/regression_runner.py

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sme-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sme-portal/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: CI=true npx react-scripts test --watchAll=false
      # CI=false: existing unused-import lint warnings would otherwise fail the build.
      # Clean those up, then drop this override.
      - name: Production build
        run: CI=false npm run build
